name: Gonix tests

on:
  push:
  pull_request:

jobs:
  pester:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Run Pester
        shell: pwsh
        run: Invoke-Pester -Path ./Tests/Gonix.Tests.ps1 -Output Detailed
